    <style>
        /* 1. RESET E FUNDO COM GRADIENTE DINÂMICO PREMIUM */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', sans-serif; background-color: #02040a;
            overflow-x: hidden; color: #fff; scroll-behavior: smooth;
        }

        .page-wrapper {
            /* Degradê sofisticado simulando uma nebulosa espacial ao fundo */
            background: radial-gradient(circle at 50% 45%, #0a142c 0%, #030611 60%, #02040a 100%);
            width: 100%; min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 2. ESTRUTURA DA SEÇÃO PRINCIPAL (CENÁRIO DA TERRA) */
        .hero-section {
            position: relative; width: 100%; min-height: 95vh;
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box; padding: 100px 20px 40px;
        }

        /* 3. ARQUITETURA AVANÇADA DA ESFERA 3D DA TERRA */
        .earth-sphere-wrapper {
            position: relative;
            width: 540px; height: 540px; 
            border-radius: 50%; overflow: hidden;
            /* Combinação de sombras externas e internas simulando a atmosfera do planeta */
            box-shadow: 
                0 0 60px rgba(63, 137, 255, 0.25), 
                inset 0 0 50px rgba(0,0,0,1),
                0 0 100px rgba(30, 64, 175, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center;
            background: #02040a;
        }

        /* Força o vídeo a ocupar a esfera sem quebras ou distorções */
        .video-earth {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            z-index: 1; transform: scale(1.02);
        }

        /* 4. MÁSCARA INTELIGENTE DE CONTRASTE (CINEMATIC OVERLAY) */
        .earth-inner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Camada sutil para o texto saltar aos olhos sem apagar os detalhes do vídeo */
            background: radial-gradient(circle, rgba(2,4,10,0.3) 0%, rgba(2,4,10,0.6) 80%);
            z-index: 2;
        }

        /* 5. ENGENHARIA DO PONTO LUMINOSO (ESTRELA PULSANTE EM CSS) */
        .earth-star-glow {
            position: absolute;
            top: 30%; left: 6%; /* Localização precisa no horizonte esquerdo do planeta */
            width: 12px; height: 12px;
            background: #ffffff; border-radius: 50%; z-index: 5;
            /* Duplo efeito de brilho neon (Glow Effect) */
            box-shadow: 0 0 25px 6px #ffffff, 0 0 50px 12px rgba(63, 137, 255, 0.9);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: brightness(1); }
            50% { transform: scale(1.25); opacity: 1; filter: brightness(1.4); box-shadow: 0 0 35px 10px #ffffff, 0 0 65px 18px rgba(63, 137, 255, 1); }
        }

        /* 6. MENSAGEM IMPACTANTE CENTRALIZADA */
        .center-message-box {
            position: absolute; z-index: 4; max-width: 450px;
            padding: 0 25px; box-sizing: border-box; text-align: center;
        }

        .center-message-box h1 {
            font-size: 2.1rem; font-weight: 800; color: #fff; line-height: 1.35; margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,1), 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
        }

        .center-message-box h1 span { color: #ffaa00; }

        .center-message-box p {
            font-size: 1.05rem; color: #e5e7eb; line-height: 1.55; margin: 0 auto 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        /* 7. BOTÃO PREMIUM COM TRANSIÇÃO SUAVE */
        .btn-green {
            background-color: #198754; color: #fff; padding: 14px 34px;
            border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 1rem;
            display: inline-block; border: none; cursor: pointer;
            box-shadow: 0 4px 20px rgba(25, 135, 84, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); /* Curva de animação profissional */
        }
        .btn-green:hover { 
            background-color: #157347; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 25px rgba(25, 135, 84, 0.6); 
        }

        /* 8. SEÇÃO DO PRE-RODAPÉ (INTEGRAÇÃO DA IMAGEM HEXAGONAL) */
        .pre-footer-tech {
            position: relative; width: 100%; padding: 110px 20px;
            background: url('background-tech.png') no-repeat center center;
            background-size: cover; text-align: center; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
            border-top: 1px solid rgba(63, 98, 255, 0.1);
        }

        /* Efeito de sobreposição em degradê para mesclar a imagem perfeitamente ao fundo preto */
        .tech-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #02040a 0%, rgba(2,4,10,0.65) 50%, #050811 100%);
            z-index: 1;
        }

        .tech-content { position: relative; z-index: 2; max-width: 650px; }
        .tech-content h2 { font-size: 2.1rem; font-weight: 800; margin-bottom: 10px; color: #fff; letter-spacing: -0.5px; }
        .tech-content p { font-size: 1.05rem; color: #9ca3af; margin: 0; line-height: 1.6; }

        /* 9. JANELA FLUTUANTE ULTRA-MODERNA (GLASSMORPHISM) */
        .modal-servicos {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 2, 6, 0.8); z-index: 9999; justify-content: center; align-items: center;
            backdrop-filter: blur(12px); /* Desfoque de cinema no fundo */
            transition: all 0.3s ease;
        }
        
        .modal-content {
            position: relative; padding: 45px; border-radius: 16px; max-width: 850px; width: 90%;
            max-height: 85vh; overflow-y: auto; text-align: left;
            background: url('background-tech.png') no-repeat center center; background-size: cover;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9); border: 1px solid rgba(63, 98, 255, 0.25);
        }

        .modal-content-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 10, 19, 0.94); z-index: 1; border-radius: 16px;
        }

        .modal-body-wrapper { position: relative; z-index: 2; }
        .close-btn { position: absolute; top: 18px; right: 22px; font-size: 34px; cursor: pointer; color: #9ca3af; font-weight: bold; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        
        .grid-servicos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        
        /* Estilo transparente espelhado nos cards de habilidades */
        .card-servico { 
            padding: 24px; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px);
            transition: border 0.3s;
        }
        .card-servico:hover { border-color: rgba(63, 98, 255, 0.4); }
        .card-servico h3 { font-size: 1.15rem; margin-top: 0; margin-bottom: 10px; color: #ffaa00; font-weight: 600; }
        .card-servico p { font-size: 0.9rem; color: #d1d5db; line-height: 1.55; margin: 0; }

        footer {
            background-color: #050811; color: #525866; text-align: center;
            padding: 25px 20px; font-size: 0.85rem; width: 100%; box-sizing: border-box; position: relative; z-index: 3;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
    </style>
