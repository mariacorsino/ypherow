    <style>
        /* RESET PADRÃO INTEGRADO */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', sans-serif; background-color: #02040a;
            overflow-x: hidden; color: #fff; scroll-behavior: smooth;
        }

        /* EFEITO DEGRADÊ SUTIL NO FUNDO GLOBAL DA PÁGINA */
        .page-wrapper {
            background: radial-gradient(circle at 50% 30%, #0d1527 0%, #040814 60%, #02040a 100%);
            width: 100%; min-height: 100vh; display: flex; flex-direction: column;
        }

        /* COMPOSIÇÃO DA ÁREA CENTRAL (HERO) */
        .hero-section {
            position: relative; width: 100%; min-height: 95vh;
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box; padding: 100px 20px 40px;
        }

        /* ESFERA DA TERRA CENTRALIZADA NO MEIO EXATO */
        .earth-sphere-wrapper {
            position: relative;
            width: 480px; height: 480px; /* Diâmetro imponente */
            border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 70px rgba(30, 64, 175, 0.4), inset 0 0 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: center; align-items: center;
        }

        .video-earth {
            width: 100%; height: 100%; object-fit: cover; transform: scale(1.05);
        }

        /* PONTO LUMINOSO (ESTRELA) NO CANTO ESQUERDO DA TERRA */
        .earth-star-glow {
            position: absolute;
            top: 25%; left: 8%; /* Coordenada exata no canto esquerdo da circunferência */
            width: 12px; height: 12px;
            background: #ffffff; border-radius: 50%; z-index: 5;
            box-shadow: 0 0 20px 6px #ffffff, 0 0 40px 12px rgba(63, 137, 255, 0.8);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 25px 8px #ffffff, 0 0 50px 16px rgba(63, 137, 255, 0.9); }
        }

        /* MÁSCARA ESCURA INTERNA PARA DAR LEITURA À MENSAGEM */
        .earth-inner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 10, 0.55); z-index: 2;
        }

        /* MENSAGEM DIRETA APLICADA NO CENTRO (SOBRE A TERRA) */
        .center-message-box {
            position: absolute; z-index: 4; max-width: 420px;
            padding: 0 20px; box-sizing: border-box; text-align: center;
        }

        .center-message-box h1 {
            font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        .center-message-box h1 span { color: #ffaa00; }

        .center-message-box p {
            font-size: 0.95rem; color: #d1d5db; line-height: 1.5; margin: 0 auto 25px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        /* BOTÃO DE CONTATO CENTRALIZADO */
        .btn-green {
            background-color: #198754; color: #fff; padding: 12px 28px;
            border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.95rem;
            display: inline-block; transition: all 0.2s; border: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
        }
        .btn-green:hover { background-color: #157347; transform: translateY(-1px); }

        /* IMAGEM DO CABEÇALHO (HEXÁGONOS AZUIS) APLICADA ABAIXO, QUASE NO RODAPÉ */
        .pre-footer-tech {
            position: relative; width: 100%; padding: 80px 20px;
            background: url('background-tech.png') no-repeat center center;
            background-size: cover; text-align: center; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
        }

        .tech-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #02040a 0%, rgba(2,4,10,0.6) 50%, #050811 100%);
            z-index: 1;
        }

        .tech-content {
            position: relative; z-index: 2; max-width: 600px;
        }

        .tech-content h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .tech-content p { font-size: 0.95rem; color: #9ca3af; margin: 0; line-height: 1.5; }

        /* JANELA FLUTUANTE DE SERVIÇOS */
        .modal-servicos {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }
        
        .modal-content {
            position: relative; padding: 40px; border-radius: 16px; max-width: 850px; width: 90%;
            max-height: 85vh; overflow-y: auto; text-align: left;
            background: url('background-tech.png') no-repeat center center; background-size: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(63, 98, 255, 0.2);
        }

        .modal-content-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95); z-index: 1; border-radius: 16px;
        }

        .modal-body-wrapper { position: relative; z-index: 2; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 32px; cursor: pointer; color: #9ca3af; font-weight: bold; }
        .close-btn:hover { color: #fff; }
        .grid-servicos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-servico { padding: 22px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(4px); }
        .card-servico h3 { font-size: 1.15rem; margin-top: 0; margin-bottom: 10px; color: #ffaa00; font-weight: 600; }
        .card-servico p { font-size: 0.9rem; color: #d1d5db; line-height: 1.5; margin: 0; }

        footer {
            background-color: #050811; color: #525866; text-align: center;
            padding: 22px 20px; font-size: 0.85rem; width: 100%; box-sizing: border-box; position: relative; z-index: 3;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
    </style>
</head>
