<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="TK9kMJtPB0D58p_iiV2zznH7ZuK6tCFKPHv6nNZHjkg" />
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.io">
    <meta property="og:title" content="YpHeroW.ai | Automações Inteligentes">
    <meta property="og:description" content="Elimine tarefas manuais e otimize seus processos para escalar suas vendas com automação.">

    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* RESET E CONFIGURAÇÕES BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
            color: #fff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ESCAPE CÓSMICO: FUNDO COM NEBULOSA PRATEADA SUTIL */
        .page-wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: 
                radial-gradient(circle at 20% 30%, rgba(148, 163, 184, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(203, 213, 225, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #061026 0%, #030611 60%, #02040a 100%);
            background-image: url('background'), radial-gradient(circle at 50% 50%, #061026 0%, #02040a 100%);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* CABEÇALHO DA NAVEGAÇÃO */
        header {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo span {
            color: #ffaa00;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav a {
            color: #b3b9c9;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #fff;
        }

        /* BOTÕES ESTILO PREMIUM */
        .btn-green {
            background-color: #198754;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-green:hover { 
            background-color: #157347; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(25, 135, 84, 0.5); 
        }

        .btn-large {
            padding: 14px 34px;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(25, 135, 84, 0.4);
        }

        /* SEÇÃO CENTRAL DO HERO */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 120px 20px 40px;
        }

        /* ESTRUTURA IDÊNTICA DA ESFERA DA TERRA */
        .earth-sphere-wrapper {
            position: relative;
            width: 540px;
            height: 540px; 
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(63, 137, 255, 0.25), 
                inset 0 0 50px rgba(0,0,0,1),
                0 0 100px rgba(30, 64, 175, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #02040a;
            z-index: 1;
        }

        .video-earth {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scale(1.02);
            pointer-events: none;
        }

        .earth-inner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(2,4,10,0.3) 0%, rgba(2,4,10,0.6) 80%);
            z-index: 2;
        }

        /* SEU PONTO LUMINOSO MANTIDO */
        .earth-star-glow {
            position: absolute;
            top: 30%;
            left: 6%;
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 25px 6px #ffffff, 0 0 50px 12px rgba(63, 137, 255, 0.9);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: brightness(1); }
            50% { transform: scale(1.25); opacity: 1; filter: brightness(1.4); box-shadow: 0 0 35px 10px #ffffff, 0 0 65px 18px rgba(63, 137, 255, 1); }
        }

        /* CONTEÚDO TEXTUAL SOBREPOSTO EXATAMENTE COMO A IMAGEM */
        .center-message-box {
            position: absolute;
            z-index: 4;
            max-width: 850px;
            padding: 0 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .center-message-box h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.35;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,1), 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
            max-width: 750px;
        }

        .center-message-box h1 span {
            color: #ffaa00;
        }

        .center-message-box p {
            font-size: 1.05rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0 auto 35px;
            max-width: 620px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        /* SEÇÃO DE SERVIÇOS BASEADA NO DOCUMENTO */
        .services-section {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px;
            z-index: 5;
        }

        .services-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 170, 0, 0.3);
            background: rgba(255, 255, 255, 0.04);
        }

        .service-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffaa00;
        }

        .service-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* FOOTER */
        footer {
            background-color: #050811;
            color: #64748b;
            text-align: center;
            padding: 25px 20px;
            font-size: 0.85rem;
            width: 100%;
            position: relative;
            z-index: 3;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: auto;
        }

        /* RESPONSIVIDADE PARA CELULAR */
        @media (max-width: 768px) {
            header {
                padding: 20px;
            }
            nav {
                display: none;
            }
            .earth-sphere-wrapper {
                width: 320px;
                height: 320px;
            }
            .center-message-box h1 {
                font-size: 1.6rem;
            }
            .center-message-box p {
                font-size: 0.95rem;
                margin-bottom: 20px;
            }
            .services-section {
                padding: 40px 20px;
            }
            .services-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

        <!-- CABEÇALHO DA NAVEGAÇÃO -->
        <header>
